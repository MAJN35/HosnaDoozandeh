<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Neumorphic Outer Gradient -->
    <linearGradient id="neuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D6E4F0" />
    </linearGradient>
    
    <!-- Primary Emblem Gradient (Navy & Slate) -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D5A80" />
      <stop offset="100%" stop-color="#1B3252" />
    </linearGradient>

    <!-- Warm Amber / Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B170" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#98AFCA" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Base with Neumorphic Drop Shadow -->
  <circle cx="32" cy="32" r="28" fill="url(#neuBg)" filter="url(#softShadow)" stroke="#FFFFFF" stroke-width="1.5" />
  
  <!-- Subtle Inner Ring Accent -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#CBDCEE" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Stylized Academic Laurel Leaves (Left & Right) -->
  <path d="M19 33 C18 28 20 22 25 18 C23 23 23 27 22 32 Z" fill="url(#goldGrad)" opacity="0.85" />
  <path d="M45 33 C46 28 44 22 39 18 C41 23 41 27 42 32 Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Center Emblem: Stylized Monogram "H" / Architectural Column of Education -->
  <!-- Left Pillar -->
  <rect x="22" y="21" width="4.5" height="22" rx="2.25" fill="url(#emblemGrad)" />
  
  <!-- Right Pillar -->
  <rect x="37.5" y="21" width="4.5" height="22" rx="2.25" fill="url(#emblemGrad)" />
  
  <!-- Arch / Crossbar with Academic Arc -->
  <path d="M22 31.5 Q32 28.5 42 31.5" stroke="url(#emblemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Golden Star of Excellence / Wisdom at Top Center -->
  <polygon points="32,15.5 33.5,18.5 36.5,19 34.2,21.2 34.8,24.2 32,22.6 29.2,24.2 29.8,21.2 27.5,19 30.5,18.5" fill="url(#goldGrad)" />

  <!-- Subtle Bottom Foundation Base -->
  <rect x="20" y="44.5" width="24" height="2" rx="1" fill="url(#emblemGrad)" opacity="0.6" />
</svg>
