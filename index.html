        <h1>حسنا دوزنده | مدیر دبیرستان دخترانه هما (دوره دوم) و روانشناس (سنجش و اندازه‌گیری)</h1>
        <p>وب‌سایت و رزومه رسمی حسنا دوزنده (Hosna Doozandeh)؛ مدیر دبیرستان دخترانه هما (دوره دوم)، موسس مدارس دخترانه هما، عضو هیئت مدیره موظف مؤسسه فرهنگی آموزشی هما و روانشناس متخصص سنجش و اندازه‌گیری (روان‌سنج) در منطقه ۵ تهران.</p>
        <h2>سوابق مدیریتی و اجرایی حسنا دوزنده</h2>
        <ul>
          <li>مدیر دوره دوم دبیرستان دخترانه هما (۱۴۰۴ تاکنون)</li>
          <li>موسس مدارس دخترانه هما و نماینده حقوقی مؤسسه فرهنگی آموزشی هما (۱۴۰۱ تاکنون)</li>
          <li>عضو هیئت مدیره موظف و قائم‌مقام مدیرعامل مؤسسه آموزشی فرهنگی هما (۱۴۰۰ تاکنون)</li>
          <li>مدیر دبستان پسرانه هما و قائم‌مقام مدیرعامل (۱۳۹۹ تا ۱۴۰۴)</li>
          <li>مدیر داخلی و مشاور ارشد دبستان پسرانه هما (۱۳۹۶ تا ۱۳۹۹)</li>
        </ul>
        <h2>پژوهش‌ها و مقالات علمی حسنا دوزنده</h2>
        <p>بررسی ویژگی‌های روان‌سنجی پرسشنامه سلامت روان مثبت (PMHQ) و رابطه آن با بهزیستی روان‌شناختی در جامعه ایرانی — فصلنامه علمی-پژوهشی روان‌سنجی، دوره ۱۴، شماره ۵۳.</p>
        <h2>ارتباط با حسنا دوزنده</h2>
